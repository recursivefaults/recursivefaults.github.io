# Site settings
title: Ryan Latta
email: ryan@ryanlatta.com
description: > # this means to ignore newlines until "baseurl:"
  Ryan Latta is a consultant that specalizes in creating high-performing software groups, and coaches
  developers through their careers. Here you'll find offerings, products, and articles to help you
  transform your group and your career.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://ryanlatta.com" # the base hostname & protocol for your site
twitter_username: recursivefaults
github_username:  recursivefaults

#Collections
collections:
  workshops:
  talks:
  podcasts:
  case_study:
    output: true

plugins:
    - jekyll-feed
    - jekyll-paginate-v2
    - jekyll-sitemap

feed:
    tags:
      path: "/feed/tags/"
      only:
        - newsletter
    categories:
        - career
        - leadership
        - product-management

# Build settings
markdown: kramdown

sass:
    sass_dir: _sass

permalink: /:categories/:title

defaults:
    -
      scope:
        path: "content/**"
      values:
        sitemap: false
    -
      scope:
        path: "" # an empty string here means all files in the project
        type: "posts" # previously `post` in Jekyll 2.2.
      values:
        layout: "post" 
        category: "leadership" 
        cta_header: Free booklet on Measures and Signals!
        cta_url: https://sendfox.com/lp/mno2g0
        cta_text: Get a free booklet of distilled wisdom on using metrics and my weekly newsletter to help you create exceptional teams.
    - scope:
        path: ""
        type: "pages"
      values:
        cta_header: Sign Up!
        cta_url: https://sendfox.com/lp/mno2g0
        cta_text: I wrote a FREE email series describing how I go about building software teams that have up to 10x performance!
    - scope:
        path: ""
        category: "career"
      values:
        cta_text: Want to know the essentials for starting and growing your career? I wrote a free email series to help.
        cta_header: Join Now!
        cta_url: https://sendfox.com/lp/m7z24v
    - scope:
        path: ""
        category: "product-management"
      values:
        cta_header: Free booklet on Measures and Signals!
        cta_url: https://sendfox.com/lp/mno2g0
        cta_text: Get a free booklet of distilled wisdom on using metrics and my weekly newsletter to help you create exceptional teams.

pagination:
  enabled: true
  per_page: 6
  sort_field: 'date'
  sort_reverse: true

autopages:
  enabled: true
  tags:
    layouts: 
      - 'autopages-tags.html'
    permalink: '/tag/:tag'


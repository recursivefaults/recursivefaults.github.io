---
layout: generic
---
<h1>{{page.title}}</h1>
<span class="image fit">
    <img id="article-image" data-unsplash-id="{{page.cover_image}}">
</span>

<div>
    <p class="post-meta">
    {{ page.date | date: "%b %-d, %Y" }}{% if page.author %} • {{ page.author }}{% endif %}{% if page.meta %} • {{ page.meta }}{% endif %}
    </p>
</div>
{{ content }}
